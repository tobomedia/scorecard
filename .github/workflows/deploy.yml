name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Live score sharing is optional: it deploys only once both Cloudflare secrets exist.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy live score server (Cloudflare Worker)
        id: live
        if: env.HAS_CLOUDFLARE == 'true'
        continue-on-error: true # if this fails the app still deploys, just without live sharing
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: live
          wranglerVersion: '4.156.0'
          command: deploy

      - name: Find live server address
        id: liveurl
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          DEPLOY_URL: ${{ steps.live.outputs.deployment-url }}
          DEPLOY_LOG: ${{ steps.live.outputs.command-output }}
          OVERRIDE_URL: ${{ vars.LIVE_API_URL }}
        run: |
          url="$OVERRIDE_URL"
          [ -z "$url" ] && url="$DEPLOY_URL"
          [ -z "$url" ] && url=$(printf '%s' "$DEPLOY_LOG" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1)
          echo "Live server: ${url:-not found}"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build (hash file names, stamp version)
        run: node scripts/build.mjs _site
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          LIVE_API_URL: ${{ steps.liveurl.outputs.url }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
